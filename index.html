<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Dinosaur AR Test (No GPS)</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;">

    <!-- แสงสว่างในฉากเพื่อให้เห็นสีและรายละเอียดโมเดลชัด -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="1.5" position="2 4 3"></a-light>

    <!-- กล้องหลักแบบไม่ใช้ GPS -->
    <a-camera look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>

    <!-- โมเดลไดโนเสาร์วางล่วงหน้าด้านหน้ากล้อง (แก้ชื่อไฟล์ .glb ให้ตรงกับใน Repo) -->
    <a-entity
      gltf-model="./dinosaur.glb"
      animation-mixer="clip: *; loop: repeat;"
      position="0 -1.5 -10"
      rotation="0 70 0"
      scale="2 2 2">
    </a-entity>

  </a-scene>
</body>
</html>
